# Builds the 3D Scanner app as an unsigned Scanner3D.ipa on GitHub's macOS
# runners, for sideloading (sign and install it with KSign, AltStore, etc.).
# Download it from the run's "Artifacts". Builds on main are also published to
# the "scanner-latest" pre-release.
name: Build iOS app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Scanner3D.xcodeproj -scheme Scanner3D \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)"
          test -d build/Build/Products/Release-iphoneos/Scanner3D.app

      - name: Show compiler errors
        if: failure()
        run: grep -E -B2 -A3 "error:" build.log | head -300 || tail -100 build.log

      - name: Package Scanner3D.ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Scanner3D.app Payload/
          zip -qry Scanner3D.ipa Payload
          ls -lh Scanner3D.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Scanner3D-ipa
          path: Scanner3D.ipa

      - name: Publish to the scanner-latest release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete scanner-latest --cleanup-tag --yes || true
          gh release create scanner-latest Scanner3D.ipa \
            --target "$GITHUB_SHA" --prerelease \
            --title "3D Scanner app (latest build)" \
            --notes "Unsigned IPA built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Sign and install it with KSign or AltStore. Needs iOS 17+; Object, Space and Room modes need a LiDAR iPhone/iPad (Pro models)."
